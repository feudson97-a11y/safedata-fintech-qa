name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e .
      - run: python -m unittest discover -s tests -t . -v
      - name: End-to-end smoke run
        env:
          SAFEDATA_HMAC_KEY: ci-only-demo-key-not-a-secret
        run: |
          safedata generate --rows 2000
          safedata run

  agentic:
    # Optional LangGraph engine: isolated job so the core matrix never depends on it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[agentic]"
      - run: python -m unittest tests.integration.test_graph_engine -v
      - name: End-to-end smoke run (langgraph engine)
        env:
          SAFEDATA_HMAC_KEY: ci-only-demo-key-not-a-secret
        run: |
          safedata generate --rows 2000
          safedata run --engine langgraph
